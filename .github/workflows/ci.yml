name: CI

# Build and test every branch/PR, retaining per-architecture candidate bundles.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: swift build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode (26+)
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx

      - name: Cache SPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-ci-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-ci-${{ runner.os }}-

      - name: swift build
        run: swift build -c release

      - name: swift test
        run: swift test

      # Sanity: ensure the per-arch bundle script works on CI. Runner is
      # arm64, so arm64 compiles natively; x86_64 is a cross-compile.
      - name: Bundle arm64
        run: ./scripts/make-app-bundle.sh "$(cat VERSION)-ci.${GITHUB_RUN_NUMBER}" arm64 "$GITHUB_RUN_NUMBER"

      - name: Upload arm64 candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kiln-arm64-${{ github.sha }}
          path: dist/Kiln-*-arm64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Bundle x86_64
        run: ./scripts/make-app-bundle.sh "$(cat VERSION)-ci.${GITHUB_RUN_NUMBER}" x86_64 "$GITHUB_RUN_NUMBER"

      - name: Upload x86_64 candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kiln-x86_64-${{ github.sha }}
          path: dist/Kiln-*-x86_64.zip
          if-no-files-found: error
          retention-days: 14
