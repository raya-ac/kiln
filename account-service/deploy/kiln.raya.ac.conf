name = kiln-raya-ac
server_name = kiln.raya.ac
serve_static_root = false
php_info_page = false
proxy = http://127.0.0.1:27480
upstream_timeout_ms = 15000
upstream_retries = 0
cache_control = no-store
tls_cert = /etc/letsencrypt/live/kiln.raya.ac/fullchain.pem
tls_key = /etc/letsencrypt/live/kiln.raya.ac/privkey.pem
header = Strict-Transport-Security: max-age=31536000
header = X-Content-Type-Options: nosniff
header = Referrer-Policy: no-referrer
